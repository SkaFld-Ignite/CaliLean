store:
  name: "CaliLean"
  default_currency: "usd"
  supported_currencies: ["usd", "eur"]

regions:
  - name: "United States"
    currency_code: "usd"
    countries: ["us"]
    automatic_taxes: true
  - name: "Europe"
    currency_code: "eur"
    countries: ["dk", "fr", "de", "it", "es", "se", "gb"]
    automatic_taxes: true

categories:
  - name: "Peptides"
    handle: "peptides"
    children:
      - name: "Recovery"
        handle: "recovery"
      - name: "Weight Management"
        handle: "weight-management"
      - name: "Growth & Anti-Aging"
        handle: "growth-anti-aging"
      - name: "Longevity"
        handle: "longevity"
      - name: "Cosmetic"
        handle: "cosmetic"
  - name: "Supplies"
    handle: "supplies"

